<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="djGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- App Icon Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#djGradient)" />
  
  <!-- Calendar Matrix Container -->
  <g filter="url(#shadow)" transform="translate(64, 64)">
    <!-- Calendar Body -->
    <rect x="0" y="48" width="384" height="320" rx="36" fill="#ffffff" />
    <!-- Calendar Header -->
    <path d="M0 48 Q0 16 36 16 L348 16 Q384 16 384 48 L384 104 L0 104 Z" fill="#10b981" />
    
    <!-- Calendar Rings -->
    <rect x="80" y="0" width="28" height="36" rx="14" fill="#065f46" />
    <rect x="276" y="0" width="28" height="36" rx="14" fill="#065f46" />
    
    <!-- Timetable Grid Cells -->
    <rect x="44" y="140" width="76" height="56" rx="12" fill="#d1fae5" />
    <rect x="154" y="140" width="76" height="56" rx="12" fill="#e0e7ff" />
    <rect x="264" y="140" width="76" height="56" rx="12" fill="#fef3c7" />
    
    <rect x="44" y="224" width="76" height="56" rx="12" fill="#fee2e2" />
    <rect x="154" y="224" width="76" height="56" rx="12" fill="#d1fae5" />
    <rect x="264" y="224" width="76" height="56" rx="12" fill="#e0e7ff" />
    
    <!-- Checkmark Badge on bottom cell -->
    <circle cx="302" cy="252" r="16" fill="#059669" />
    <path d="M295 252 L300 257 L309 247" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
